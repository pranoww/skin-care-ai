[project]
name = "skin-care-ai"
version = "0.1.0"
description = "AI-powered skin care issue analysis assistant"
readme = "README.md"
authors = [
    { name = "pranav", email = "pranavlande444@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.145.0",
    "httpx>=0.28.1",
    "langchain>=1.4.10",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
